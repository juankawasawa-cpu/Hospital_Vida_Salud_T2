server:
  port: 8082
spring:
  application:
    name: appointment-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidasalud}
    username: ${DB_USER:vidasalud}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:vidasalud}
    password: ${RABBITMQ_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
services:
  patient-url: http://patient-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
