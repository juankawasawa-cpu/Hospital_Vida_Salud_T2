server:
  port: 8081
spring:
  application:
    name: patient-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidasalud}
    username: ${DB_USER:vidasalud}
    password: ${DB_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
