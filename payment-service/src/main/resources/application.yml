server:
  port: 8085
spring:
  application:
    name: payment-service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/vidasalud}
    username: ${DB_USER:vidasalud}
    password: ${DB_PASSWORD}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
services:
  patient-url: http://patient-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
